[project]
name = "reedle-tutor-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11.3,<13",
    "pydantic>=2.10,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["jsonschema>=4.23,<5", "pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
