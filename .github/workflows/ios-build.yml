name: iPad app build

on:
  push:
    branches: [main, aet-34-canvas-contracts, codex/aet-32-drawing-round-trip, codex/canvas-camera]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.21,<5'
      - run: python tools/validate_contracts.py
      - run: python -m unittest tools.test_ipad_runner
      - run: python -m pip install 'uv>=0.9,<1'
      - name: Run the tutor server regression suite
        run: uv run --directory server --locked pytest -q
      - name: Test handwriting evaluation
        run: uv run --project server --locked python -m pytest -q evaluation/tests
      - name: Test sealed live credential bootstrap
        run: uv run --project server --locked python -m unittest tools.test_live_ipad_bootstrap

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      REEDLE_LIVE_TEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[live-baze]') && '1' || '0' }}
      REEDLE_UNIT_ONLY: ${{ contains(github.event.head_commit.message, '[unit-only]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: brew install xcodegen uv
      - name: Prepare per-run live credential wrapping key
        if: env.REEDLE_LIVE_TEST == '1'
        run: uv run --project server --locked --python 3.12 python tools/run_live_ipad.py prepare
      - name: Publish only the public wrapping key
        if: env.REEDLE_LIVE_TEST == '1'
        uses: actions/upload-artifact@v4
        with:
          name: native-live-public-key
          path: .build/live-ipad/public-key.json
          retention-days: 1
      - name: Build and run tests on iPad Simulator
        run: |
          xcodebuild -version
          if [ "$REEDLE_LIVE_TEST" = '1' ]; then
            if [ "$REEDLE_UNIT_ONLY" = '1' ]; then
              uv run --project server --locked --python 3.12 python tools/run_live_ipad.py test --only-testing ReedlesCanvasTests
            else
              uv run --project server --locked --python 3.12 python tools/run_live_ipad.py test
            fi
          else
            python3 tools/test_ipad.py
          fi
      - name: Keep iPad test logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-test-results
          path: .build/ipad-tests/
          if-no-files-found: ignore
          retention-days: 7
