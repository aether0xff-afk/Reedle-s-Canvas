name: iPad app build

on:
  push:
    branches: [main, aet-34-canvas-contracts, codex/aet-32-drawing-round-trip]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.21,<5'
      - run: python tools/validate_contracts.py

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an available iPad simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          inventory = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          for runtime, devices in json.loads(inventory)["devices"].items():
              platform, *version = runtime.rsplit(".", 1)[-1].split("-")
              if platform != "iOS" or int(version[0]) < 17:
                  continue
              for device in devices:
                  if device["deviceTypeIdentifier"].split(".")[-1].startswith("iPad"):
                      print(f'Selected {device["name"]} on {runtime}')
                      with open(os.environ["GITHUB_ENV"], "a") as env:
                          print(f'SIMULATOR_UDID={device["udid"]}', file=env)
                      raise SystemExit(0)
          raise SystemExit("No available iPad simulator with iOS 17 or later")
          PY
      - name: Build and run tests on iPad Simulator
        run: |
          xcodebuild -version
          xcodebuild \
            -project ReedlesCanvas.xcodeproj \
            -scheme ReedlesCanvas \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            test
