name: Normal app preview

on:
  push:
    branches: [codex/canvas-camera]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[app-preview]') }}
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      COMPILE_ONLY: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compile-only]') }}
      DEVICE_BUILD: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[device-build]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project generator
        run: brew install xcodegen
      - name: Package the normal iPad source
        run: |
          if [ "$COMPILE_ONLY" = "true" ]; then
            python3 tools/package_app_preview.py --compile-only
          else
            python3 tools/package_app_preview.py
          fi
      - name: Build the app without running tests
        run: |
          if [ "$COMPILE_ONLY" = "true" ]; then
            python3 tools/render_app_preview.py --compile-only
          else
            python3 tools/render_app_preview.py
          fi
      - name: Build the unsigned iPad device IPA
        if: env.DEVICE_BUILD == 'true'
        run: python3 tools/build_ipad_artifact.py
      - name: Keep app source and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-app-preview
          path: |
            .build/app-preview/
            .build/ReedlesCanvas-App.swiftpm.zip
            .build/ReedlesCanvas-App-manifest.json
            .build/ipad-build/
          retention-days: 7
