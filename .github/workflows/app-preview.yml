name: Normal app preview

on:
  push:
    branches: [codex/canvas-camera]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[app-preview]') }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project generator
        run: brew install xcodegen
      - name: Package the normal iPad source
        run: python3 tools/package_app_preview.py
      - name: Build and render the app without running tests
        run: python3 tools/render_app_preview.py
      - name: Keep app source, screenshot and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-app-preview
          path: |
            .build/app-preview/
            .build/ReedlesCanvas-App.swiftpm.zip
            .build/ReedlesCanvas-App-manifest.json
          retention-days: 7
